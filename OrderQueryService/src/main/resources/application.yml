server:
  port: 8091

spring:
  application:
    name: order-query-service
  
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 30000
    read1:
      url: jdbc:postgresql://${READ_DB_HOST_1:localhost}:${READ_DB_PORT_1:5439}/${READ_DB_NAME:order_read_db}
      username: ${READ_DB_USER:postgres}
      password: ${READ_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    read2:
      url: jdbc:postgresql://${READ_DB_HOST_2:localhost}:${READ_DB_PORT_2:5439}/${READ_DB_NAME:order_read_db}
      username: ${READ_DB_USER:postgres}
      password: ${READ_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    read3:
      url: jdbc:postgresql://${READ_DB_HOST_3:localhost}:${READ_DB_PORT_3:5439}/${READ_DB_NAME:order_read_db}
      username: ${READ_DB_USER:postgres}
      password: ${READ_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      port: ${REDIS_PORT:6380}
      host: ${REDIS_HOST:localhost}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka:
  replication-factor: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  tracing:
    enabled: false

logging:
  level:
    com.highvia.orderqueryservice: INFO

---
spring:
  config:
    activate:
      on-profile: prod

kafka:
  replication-factor: 3

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger.cloudorder.local:4318/v1/traces

